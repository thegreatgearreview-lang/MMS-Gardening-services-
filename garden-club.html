<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMS Garden Club | MMS Nursery</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fffdf8;color:#183027}header{background:#fffdf8;border-bottom:1px solid #dce3dc}nav{width:min(1120px,92%);height:92px;margin:auto;display:flex;align-items:center;gap:12px}.brand{width:125px;height:58px;background:url('images/mms-logo-master.svg') center/contain no-repeat}.contact{margin:auto;color:#245b3a;font-weight:800;text-align:center;line-height:1.25;display:flex;flex-direction:column;align-items:center}.header-phone{color:#245b3a!important;text-decoration:none!important}.btn{display:inline-block;border:0;border-radius:999px;padding:11px 20px;background:#245b3a;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.wrap{width:min(720px,92%);margin:55px auto;background:#edf3ec;border:2px solid #2f6b46;border-radius:22px;padding:35px;box-sizing:border-box}.wrap h1{font:600 44px/1.05 Georgia,serif;margin:8px 0 14px}.wrap p{color:#62736b;line-height:1.5}.form{display:grid;gap:12px;margin-top:22px}.form input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd9d1;border-radius:10px;font:inherit;background:#fff}.form label{font-size:13px;line-height:1.4}.status{min-height:24px;font-weight:700}@media(max-width:520px){nav{height:78px}.brand{width:105px}.wrap{margin:30px auto;padding:24px 18px}.wrap h1{font-size:34px}.wrap .btn{width:100%;box-sizing:border-box;text-align:center}}</style></head><body><header><nav><a class="brand" href="nursery.html"></a><div class="contact"><span>MMS Nursery Nottingham</span><a class="header-phone" href="tel:+447989892662">07989 892662</a></div><a class="btn" href="basket.html">🛒 Basket</a></nav></header><main class="wrap"><small>🌱 MMS GARDEN CLUB</small><h1>Join the Garden Club</h1><p>Get <strong>10% off your nursery purchases permanently</strong>, plus plant news, seasonal updates, exclusive offers and first access to selected new stock.</p><form class="form" id="garden-club-form"><input name="firstName" placeholder="First name (optional)" autocomplete="given-name"><input name="email" type="email" placeholder="Email address" autocomplete="email" required><label><input name="consent" type="checkbox" required> Yes, I'd like to receive MMS Garden Club news, nursery updates and offers by email.</label><button class="btn" type="submit">Join the MMS Garden Club</button><div class="status" id="status" aria-live="polite"></div></form></main><script>document.getElementById('garden-club-form').addEventListener('submit',async function(e){e.preventDefault();const form=e.currentTarget,status=document.getElementById('status'),data=Object.fromEntries(new FormData(form).entries());data.consent=form.consent.checked;status.textContent='Joining…';try{const r=await fetch('/api/garden-club',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not join');localStorage.setItem('mmsGardenClub','true');localStorage.setItem('mmsGardenClubCode','GARDEN10');status.innerHTML='You’re in! 🌱 Your 10% discount code is <strong>GARDEN10</strong>. Check your email too.';form.reset()}catch(err){status.textContent=err.message}});</script></body></html>
