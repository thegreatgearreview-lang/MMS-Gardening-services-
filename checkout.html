<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | MMS Nursery</title><link rel="stylesheet" href="styles-v2.css?v=20260918-checkout">
<style>
.checkout-page{max-width:760px;margin:auto;padding:60px 6%}.checkout-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 6px 22px #00000010}.checkout-page h1{margin-top:8px}.checkout-page form{display:grid;gap:14px}.checkout-page label{font-weight:800;color:#245b3a}.checkout-page input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fffdf8}.checkout-summary{margin:20px 0;padding:16px;background:#f3f7f2;border-radius:14px}.checkout-summary-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.checkout-total{font-size:20px;font-weight:900;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}.status{min-height:24px;font-weight:800;color:#245b3a}.payment-area{margin-top:22px}.small{font-size:13px;color:var(--muted);line-height:1.5}
</style></head><body>
<header><nav style="width:min(1120px,92%);height:92px;margin:auto;display:flex;align-items:center;gap:12px"><a class="brand" href="index.html" aria-label="MMS Gardening Services home"></a><span style="margin:auto;color:#245b3a;font-weight:800">MMS Nursery Checkout</span><a class="btn" href="basket.html">← Basket</a></nav></header>
<main class="checkout-page"><small>MMS NURSERY</small><h1>Checkout</h1>
<div class="checkout-card"><div id="summary"></div>
<form id="checkout-form"><label>First name<input name="firstName" autocomplete="given-name" required></label><label>Last name<input name="lastName" autocomplete="family-name"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><p class="small">We'll use this email for your MMS order confirmation after SumUp confirms payment.</p><button class="btn" type="submit">Continue to secure payment</button><div class="status" id="status" aria-live="polite"></div></form>
<div id="payment-area" class="payment-area" hidden><h2>Secure payment</h2><p class="small">Choose the fastest payment method available to you, including Apple Pay or Google Pay when supported, or pay by card.</p><div id="sumup-card"></div></div>
</div></main>
<script src="https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js"></script>
<script>
(function(){
const KEY='mmsBasket';
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const price=v=>{const m=String(v||'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):0};
const basket=read().map(x=>({...x,quantity:Math.max(1,parseInt(x.quantity,10)||1)})).filter(x=>x.name);
const total=basket.reduce((n,x)=>n+price(x.price)*x.quantity,0);
const summary=document.getElementById('summary'),form=document.getElementById('checkout-form'),status=document.getElementById('status'),paymentArea=document.getElementById('payment-area');
if(!basket.length||total<=0){summary.innerHTML='<p>Your basket is empty. <a href="nursery.html">Return to the nursery</a>.</p>';form.remove();return}
summary.innerHTML='<div class="checkout-summary">'+basket.map(x=>'<div class="checkout-summary-row"><span>'+String(x.name).replace(/[&<>]/g,'')+' × '+x.quantity+'</span><strong>£'+(price(x.price)*x.quantity).toFixed(2)+'</strong></div>').join('')+'<div class="checkout-summary-row checkout-total"><span>Total</span><strong>£'+total.toFixed(2)+'</strong></div></div>';
form.addEventListener('submit',async e=>{
 e.preventDefault(); status.textContent='Preparing secure payment…';
 const fd=new FormData(form), payload={firstName:fd.get('firstName'),lastName:fd.get('lastName'),email:fd.get('email'),items:basket};
 try{
  const r=await fetch('/api/sumup/create-checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json(); if(!r.ok)throw new Error(j.error||'Could not start checkout');
  if(!window.SumUpCard)throw new Error('SumUp payment is temporarily unavailable.');
  form.querySelector('button').disabled=true; paymentArea.hidden=false; status.textContent='Secure payment ready.';
  window.SumUpCard.mount({
    id:'sumup-card',
    checkoutId:j.checkoutId,
    email:payload.email,
    showEmail:false,
    amount:j.amount.toFixed(2),
    currency:'GBP',
    locale:'en-GB',
    country:'GB',
    onResponse:function(type,body){
      if(type==='sent'||type==='auth-screen')status.textContent='Payment being processed securely…';
      else if(type==='success'){status.textContent='Payment received — confirming your order…';setTimeout(()=>{localStorage.removeItem(KEY);location.href='/thankyou.html?order='+encodeURIComponent(j.orderId)},900)}
      else if(type==='fail')status.textContent='Payment was not completed. You can try again.';
      else if(type==='error')status.textContent='There was a payment problem. Please try again.';
    }
  });
 }catch(err){status.textContent=err.message;form.querySelector('button').disabled=false}
});
})();
</script></body></html>
