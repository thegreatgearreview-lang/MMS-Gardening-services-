<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Basket | MMS Nursery</title><link rel="stylesheet" href="styles-v2.css?v=20260824-basket"><style>.basket-page{max-width:1000px;margin:auto;padding:70px 6%}.basket-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.basket-empty{padding:30px 0}.remove{border:0;background:none;text-decoration:underline;cursor:pointer;color:#245b3a}.basket-actions{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}</style></head><body><header><nav><a class="brand" href="index.html" aria-label="MMS Gardening Services home"></a><span class="header-location">MMS Nursery · Nottingham</span><a class="header-phone" href="tel:+447989892662">📞 07989 892662</a><a class="btn" href="nursery.html">🌱 Nursery</a><a class="btn" href="index.html">← MMS Website</a></nav></header><main class="basket-page"><small>MMS NURSERY</small><h1>Your Basket</h1><div id="basket"></div></main><footer>© <span id="year"></span> MMS Gardening Services · Nottingham</footer><script>function render(){const b=JSON.parse(localStorage.getItem('mmsBasket')||'[]');const el=document.getElementById('basket');if(!b.length){el.innerHTML='<div class="basket-empty"><p>Your basket is empty.</p><a class="btn" href="nursery.html">Browse the Nursery</a></div>';return}el.innerHTML=b.map((x,i)=>`<div class="basket-row"><div><strong>${esc(x.name)}</strong><br><span>${esc(x.category||'Nursery')} · ${esc(x.price)}</span></div><button class="remove" onclick="removeItem(${i})">Remove</button></div>`).join('')+'<div class="basket-actions"><button class="btn" onclick="sendOrder()">Send basket order</button><a class="btn light" href="nursery.html">Continue shopping</a></div>'}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function removeItem(i){const b=JSON.parse(localStorage.getItem('mmsBasket')||'[]');b.splice(i,1);localStorage.setItem('mmsBasket',JSON.stringify(b));render()}function sendOrder(){const b=JSON.parse(localStorage.getItem('mmsBasket')||'[]');const text=encodeURIComponent(`Hi MMS Gardening Services, I'd like to order from the nursery:\n${b.map(x=>`- ${x.name} (${x.price})`).join('\n')}\nPlease let me know collection/delivery and payment options.`);window.open(`https://wa.me/447989892662?text=${text}`,'_blank')}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('year').textContent=new Date().getFullYear();render()});</script></body></html>
