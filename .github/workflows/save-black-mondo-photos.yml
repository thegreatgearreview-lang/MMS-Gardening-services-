name: Save Black Mondo Grass photos to repository

on:
  push:
    branches:
      - local-image-reuse-review

permissions:
  contents: write

jobs:
  save-photos:
    if: "!contains(github.event.head_commit.message, '[photo-fetch-workflow]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: local-image-reuse-review
          persist-credentials: true
      - name: Download and validate genuine Wikimedia photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl --fail --location --retry 3 --output images/black-mondo-grass-main.jpg 'https://upload.wikimedia.org/wikipedia/commons/7/7d/Ophiopogon_planiscapus_nigrescens.jpg'
          curl --fail --location --retry 3 --output images/black-mondo-grass-gallery.jpg 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Asparagales_-_Ophiopogon_planiscapus_1.jpg'
          file images/black-mondo-grass-main.jpg images/black-mondo-grass-gallery.jpg
          python - <<'PY'
          from pathlib import Path
          for name in ('images/black-mondo-grass-main.jpg','images/black-mondo-grass-gallery.jpg'):
              data=Path(name).read_bytes()
              if not data.startswith(bytes.fromhex('ffd8ff')):
                  raise SystemExit(f'{name} is not a JPEG')
              if len(data) < 10000:
                  raise SystemExit(f'{name} is unexpectedly small ({len(data)} bytes)')
              print(f'Validated {name}: {len(data)} bytes')
          PY
      - name: Point card and gallery to repository-stored photos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          card=Path('grasses.html')
          text=card.read_text()
          old="https://upload.wikimedia.org/wikipedia/commons/7/7d/Ophiopogon_planiscapus_nigrescens.jpg"
          if old not in text:
              old="https://shop.gaertnerei-schoebel.de/media/image/b2/94/b4/S3229Z9yT8ouXr7Ylh.jpg"
          if old not in text:
              raise SystemExit('Could not find the expected Black Mondo card image URL')
          card.write_text(text.replace(old, 'images/black-mondo-grass-main.jpg'))
          product=Path('black-mondo-grass.html')
          text=product.read_text()
          text=text.replace('https://upload.wikimedia.org/wikipedia/commons/7/7d/Ophiopogon_planiscapus_nigrescens.jpg','images/black-mondo-grass-main.jpg')
          text=text.replace('https://upload.wikimedia.org/wikipedia/commons/0/0e/Asparagales_-_Ophiopogon_planiscapus_1.jpg','images/black-mondo-grass-gallery.jpg')
          product.write_text(text)
          PY
      - name: Commit image files and local references; remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/save-black-mondo-photos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/black-mondo-grass-main.jpg images/black-mondo-grass-gallery.jpg grasses.html black-mondo-grass.html .github/workflows/save-black-mondo-photos.yml
          git commit -m '[photo-fetch-workflow] Save Black Mondo Grass photos in repository'
          git push origin HEAD:local-image-reuse-review
