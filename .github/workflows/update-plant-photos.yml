name: Update MMS plant photos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Update MMS plant photos')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Bulbs & Rhizomes photos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text()
          replacements={
            'https://a.allegroimg.com/s720/11fa8f/f9952b064c9cba92f71ef2ecad63/Kosaciec-zolty-Iris-pseudacorus-C2':'https://www.rootsplants.co.uk/cdn/shop/files/30_bae03265-3630-4e58-b748-aeec2df0f9da.jpg?v=1721169322',
            'https://gobuyplants.com/cdn/shop/files/gobuyplants-perennial-1-gallon-hemerocallis-bahama-pink-sky-39142857376060_1080x.jpg?v=1769023956':'https://sprouthome.com/cdn/shop/products/HemerCH1_sprout.jpg?v=1743283625&width=1733',
            'https://groffsplantfarm.com/inventory/thumbnail.php?num=0&plu=3614&v=c2eb804':'https://groffsplantfarm.com/inventory/thumbnail.php?num=0&plu=3614&v=c2eb804',
            'https://mobileimages.lowes.com/productimages/4799b9c1-c38d-4fb1-a684-b2066cec28a6/60004413.jpg?size=pdhism':'https://mobileimages.lowes.com/productimages/4799b9c1-c38d-4fb1-a684-b2066cec28a6/60004413.jpg?size=pdhism'
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'MMS Gardening Services'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Update MMS plant photos' || exit 0
          git push
